experiment:
  name: nsw_rf_constrained_spatial_box
  seed: 42
  output_dir: outputs/nsw_rf_constrained_spatial_box
  execution_mode: train_from_archive_features
  variant: baseline
task:
  name: target_area_prediction
  region: nsw
dataset:
  root: ../EarthByte-MPM_Lachlan_Porphyry
  archive_dir: ../EarthByte-MPM_Lachlan_Porphyry/Datasets/Outputs_Cu_NSW_v1.6
model:
  name: rf_constrained
  params:
    n_jobs: -1
    n_iter: 10
    eta: 0.5
    tol: 0.001
predicates:
  enabled: true
  combine: sequential
  items:
  - name: spatial_box
    params:
      auto_center: false
      auto_side: false
      center_x: 148.6
      center_y: -33.1
      side_length: 2.0
validation:
  holdout:
    name: random_holdout
    params:
      test_size: 0.25
  cross_validation:
    name: stratified_kfold
    params:
      n_splits: 10
      shuffle: false
  metrics:
  - accuracy
  - precision
  - recall
  - f1
  - roc_auc
  - average_precision
  - balanced_accuracy
  - mcc
  - confusion_matrix
  primary_metric: f1
tuning:
  name: none
  params: {}
prediction:
  score_type: relative_score
  normalization: minmax
  export_geotiff: false
