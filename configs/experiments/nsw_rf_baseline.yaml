# 纯归档回放配置：逐字节复制归档模型与预测工件，不重新训练。
# 回放模式禁止调参 / PUB / 知识 / 谓词 / 特征算子，故此处不声明这些节。
experiment:
  name: nsw_rf_baseline
  seed: 42
  output_dir: outputs/nsw_rf_baseline
  execution_mode: archive_replay

task:
  name: target_area_prediction
  region: nsw

dataset:
  root: ../EarthByte-MPM_Lachlan_Porphyry
  archive_dir: ../EarthByte-MPM_Lachlan_Porphyry/Datasets/Outputs_Cu_NSW_v1.6

model:
  name: rf
  params:
    n_jobs: -1

prediction:
  score_type: probability
  normalization: minmax
  export_geotiff: true
